name: Node CI

on:
    push:
        branches: master
    pull_request:
        branches:
            - master

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.x, 24.x, 26.x, 27.x]

        steps:
            - uses: actions/checkout@v1
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  # Include prereleases until Node 27 reaches its first stable release.
                  node-version: ${{ matrix.node-version == '27.x' && '^27.0.0-0' || matrix.node-version }}
            - name: Install dependencies
              run: npm ci
            - name: Lint
              run: npm run lint
            - name: Build
              run: npm run build
            - name: Test
              run: npm test -- --forceExit # https://github.com/facebook/jest/issues/9982#issuecomment-758110298
            - name: Check spelling
              uses: crate-ci/typos@master
